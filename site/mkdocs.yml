# The documentation site, built by MkDocs with the Material theme from docs/ and
# published to GitHub Pages by .github/workflows/pages.yml (LP-137). Build it
# locally with:  pip install -r site/requirements.txt && mkdocs build --strict -f site/mkdocs.yml
site_name: Ligature Protocol
site_url: https://garth.github.io/ligature-protocol/
site_description: >-
  Your devices, working as one: the clipboard, notifications and files move between the
  devices you own, directly, with no account and no server.
repo_url: https://github.com/garth/ligature-protocol
repo_name: garth/ligature-protocol
edit_uri: edit/main/docs/
copyright: >-
  Specification and documentation CC-BY-4.0, code Apache-2.0.
docs_dir: ../docs
site_dir: ../build/site
strict: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/link-variant
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

hooks:
  - hooks.py

# Links that leave docs/ (the schemas, the licences, the implementation) are
# rewritten to GitHub by hooks.py, so every other broken link is an error.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Superseded decisions stay reachable by link but out of the navigation.
not_in_nav: |
  adr/superseded/*

nav:
  - Home: index.md
  - User guide:
      - 'Using Ligature': guide/index.md
      - 'Install': guide/install.md
      - 'First steps': guide/first-steps.md
      - 'The clipboard': guide/clipboard.md
      - 'Notifications': guide/notifications.md
      - 'Files': guide/files.md
      - 'Your devices': guide/devices.md
      - 'Upgrading and uninstalling': guide/upgrade-uninstall.md
      - 'Troubleshooting': guide/troubleshooting.md
  - Specification:
      - 'Overview': spec/00-overview.md
      - 'Identity': spec/01-identity.md
      - 'Device Binding': spec/02-device-binding.md
      - 'Session Encryption and Exposure': spec/03-encryption.md
      - 'Discovery and Transport': spec/04-discovery-transport.md
      - 'Capabilities': spec/05-capabilities.md
      - 'Local State and Gossip': spec/06-state-sync.md
      - 'Loss, Compromise and Rebuild': spec/07-recovery.md
      - 'Platform Notes': spec/08-platform-notes.md
      - 'Threat Model': spec/09-threat-model.md
      - 'Shared Devices and Groups': spec/10-shared-devices-and-groups.md
      - Glossary: glossary.md
      - 'Prior art': prior-art.md
  - Decisions:
      - '0001 Record architecture decisions': adr/0001-record-architecture-decisions.md
      - '0003 Per-device keys cross-signed by the user identity': adr/0003-device-cross-signing.md
      - '0008 Typed capabilities with explicit discovery, request and grant': adr/0008-capability-model.md
      - '0010 Interoperate with and bridge to existing protocols rather than replace them': adr/0010-interop-bridges.md
      - '0011 Application-level QUIC transport authenticated by device keys': adr/0011-quic-application-transport.md
      - '0012 Decentralised, replaceable, untrusted connectivity helpers': adr/0012-decentralised-untrusted-helpers.md
      - '0013 WireGuard / Headscale as an optional integration, not a transport': adr/0013-wireguard-optional-integration.md
      - '0015 Shared multi-user devices, groups, and scoped capabilities': adr/0015-shared-devices-and-groups.md
      - '0016 No required shared state: local trust stores, gossip, and live capabilities': adr/0016-no-required-shared-state.md
      - '0017 A per-person master key as the root of trust, with one proximity ceremony': adr/0017-master-key-identity-and-proximity-ceremony.md
      - '0018 Rebuild instead of recovery': adr/0018-rebuild-instead-of-recovery.md
      - '0019 Pairwise session encryption with least exposure': adr/0019-pairwise-least-exposure-encryption.md
      - '0020 JSON Schema for records and messages, reverse-DNS type names': adr/0020-json-schema-and-reverse-dns-names.md
      - '0021 A group key, and devices owned by the group': adr/0021-group-key-and-group-owned-devices.md
      - '0022 Ad-hoc sharing between people''s devices': adr/0022-ad-hoc-sharing-between-people.md
      - '0023 Group devices: registered to the group, sessions, and the authority of a request': adr/0023-group-devices-sessions-and-authority.md
      - '0024 Device security is out of scope': adr/0024-device-security-out-of-scope.md
      - '0025 CBOR as the wire encoding': adr/0025-cbor-wire-encoding.md
      - '0026 Rust is the reference implementation': adr/0026-rust-reference-implementation.md
      - '0027 Ed25519 is the signature algorithm': adr/0027-ed25519.md
      - '0028 quinn over rustls as the QUIC stack': adr/0028-quinn-over-rustls.md
      - '0029 The ceremony''s short code is derived from the TLS exporter': adr/0029-ceremony-code-from-tls-exporter.md
      - '0030 In-person verification is mandatory; there is no remote joining': adr/0030-in-person-verification-mandatory.md
      - '0031 The split key structure is the design and is implemented from the start': adr/0031-split-keys-from-the-start.md
      - '0032 No key publication; display names are self-asserted signed facts': adr/0032-no-publication-self-asserted-names.md
      - '0033 Supported platforms': adr/0033-supported-platforms.md
      - '0034 Devices and people are identified by their public keys; names default to the host name': adr/0034-keys-are-identifiers.md
      - '0035 Byte-exact signatures in one fact envelope; forgiving decoding': adr/0035-byte-exact-signatures-forgiving-decoding.md
      - '0036 Stream framing, message typing and versioning on the wire': adr/0036-stream-framing-and-message-typing.md
      - '0037 The local discovery record': adr/0037-local-discovery-record.md
      - '0038 Stream reset codes, and streams held until the peer is admitted': adr/0038-stream-reset-codes-and-admission.md
      - '0039 Whose revocation counts, and a gossiped revocation ending the live session': adr/0039-revocation-scope-and-live-session-close.md
  - Milestones:
      - 'Milestone 1: a Linux machine and a Mac share the clipboard': milestones/01-clipboard-poc.md
      - 'Milestone 1: implementation decisions': milestones/01-implementation-decisions.md
      - 'Milestone 2: an Android phone shares the clipboard with Linux and macOS': milestones/02-android-clipboard.md
      - 'Milestone 2: implementation decisions': milestones/02-implementation-decisions.md
      - 'Milestone 3 implementation decisions': milestones/03-implementation-decisions.md
      - 'Milestone 3: notifications flow between all of a person''s devices': milestones/03-notifications.md
      - 'Milestone 4: file transfer among a person''s devices over the LP session': milestones/04-files.md
      - 'Milestone 4 implementation decisions': milestones/04-implementation-decisions.md
      - 'Milestone 5 implementation decisions': milestones/05-implementation-decisions.md
      - 'Milestone 5: the clipboard carries rich text, images and files': milestones/05-rich-clipboard.md
      - 'Milestone 6: the phone''s SMS and calls, and media control, among a person''s devices': milestones/06-phone-and-media.md
