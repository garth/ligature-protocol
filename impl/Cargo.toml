[workspace]
resolver = "3"
members = [
    "crates/lp-core",
    "crates/lp-identity",
    "crates/lp-crypto",
    "crates/lp-transport",
    "crates/ligatured",
    "crates/lpctl",
    "crates/ligature-android",
    "crates/lp-macos",
    "crates/lp-vectors",
    # Non-core integrations. The protocol never depends on these.
    "integrations/wireguard-integration",
]

[workspace.package]
version = "0.1.1-alpha"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ligature-protocol/ligature-protocol"
rust-version = "1.89"

[workspace.dependencies]
lp-core = { path = "crates/lp-core", version = "0.1.1-alpha" }
lp-identity = { path = "crates/lp-identity", version = "0.1.1-alpha" }
lp-crypto = { path = "crates/lp-crypto", version = "0.1.1-alpha" }
lp-transport = { path = "crates/lp-transport", version = "0.1.1-alpha" }
lp-vectors = { path = "crates/lp-vectors", version = "0.1.1-alpha" }

# Crypto, encoding, runtime, store (LP-27). Versions are pinned by Cargo.lock;
# bumps are deliberate commits of their own.
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
getrandom = "0.4"
sha2 = "0.11"
multibase = "0.9"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = "1.0"
hex = "0.4"
# base64 0.23 turns on a SIMD path written in unsafe code by default; the
# library keeps the plain one.
base64 = { version = "0.23", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["std", "formatting", "parsing", "serde-well-known", "macros"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "signal"] }
rusqlite = { version = "0.40", features = ["bundled"] }

# Networking and discovery (LP-28). ring is the rustls provider on both platforms;
# no platform verifier, since peers are verified as raw public keys.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
mdns-sd = "0.21"
if-addrs = "0.15"

# The daemon, the CLI and the Android library: the daemon's own crates, logging,
# the command line, the device name and the pairing QR code.
ligatured = { path = "crates/ligatured", version = "0.1.1-alpha" }
lp-macos = { path = "crates/lp-macos", version = "0.1.1-alpha" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
gethostname = "1"
qrcode = { version = "0.14", default-features = false }

# Test support: temporary directories and the schema checks of the vectors.
tempfile = "3"
jsonschema = { version = "0.60", default-features = false }

# Platform integration (LP-29). Clipboard, notification and pasteboard crates are
# target-gated in ligatured; library crates never depend on them.
wl-clipboard-rs = "0.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "event", "pipe"] }
# Linux notifications over the session bus (milestone 3, LP-91).
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
futures-util = { version = "0.3", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# The Android library (milestone 2, LP-77). MPL-2.0; see deny.toml.
uniffi = { version = "0.32", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
