# cargo-deny configuration (LP-27). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # basic-toml, unmaintained: a dependency of uniffi's binding generator, which
    # runs on the host under the `bindgen` feature and is never in a library (LP-77).
    "RUSTSEC-2026-0374",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # uniffi and its support crates (LP-77): file-level copyleft that never
    # touches our own files.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
