[workspace]
resolver = "3"
members = [
    "crates/lp-core",
    "crates/lp-identity",
    "crates/lp-crypto",
    "crates/lp-transport",
    "crates/ligatured",
    "crates/lpctl",
    # Non-core integrations. The protocol never depends on these.
    "integrations/wireguard-integration",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ligature-protocol/ligature-protocol"
rust-version = "1.85"

[workspace.dependencies]
lp-core = { path = "crates/lp-core" }
lp-identity = { path = "crates/lp-identity" }
lp-crypto = { path = "crates/lp-crypto" }
lp-transport = { path = "crates/lp-transport" }

# Crypto, encoding, runtime, store (LP-27). Versions are pinned by Cargo.lock;
# bumps are deliberate commits of their own.
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand_core = { version = "0.9", features = ["os_rng"] }
sha2 = "0.11"
multibase = "0.9"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled"] }

# Networking and discovery (LP-28). ring is the rustls provider on both platforms;
# no platform verifier, since peers are verified as raw public keys.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
mdns-sd = "0.21"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
