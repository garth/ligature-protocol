name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  android-library:
    name: Android library (aarch64 and x86_64 cross-build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Cross-build the library with the runner's NDK
        run: cargo ndk -t arm64-v8a -t x86_64 build -p ligature-android --release
      - name: Kotlin bindings generate from the host build
        run: |
          cargo build -p ligature-android
          cargo run -p ligature-android --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libligature_android.so --language kotlin \
            --no-format --out-dir target/kotlin

  deny:
    name: cargo-deny (licences, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: impl/Cargo.toml
          command: check

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            docs/**/*.md

  schemas:
    name: JSON Schema compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile every schema under draft 2020-12
        run: |
          set -e
          npm install --no-save ajv-cli@5.0.0 ajv-formats@3.0.1
          # A schema may reference another by file name (message -> envelope), so every
          # other schema is supplied with -r.
          for f in schemas/*.schema.json; do
            refs=""
            for r in schemas/*.schema.json; do
              [ "$r" != "$f" ] && refs="$refs -r $r"
            done
            # shellcheck disable=SC2086
            npx ajv compile --spec=draft2020 -c ajv-formats -s "$f" $refs
          done
