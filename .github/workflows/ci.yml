name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  msrv:
    name: Builds at the minimum Rust (rust-version)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the workspace
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: cargo check at the minimum Rust
        run: cargo check --workspace --all-targets --locked

  android-library:
    name: Android library (aarch64 and x86_64 cross-build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: cargo-ndk
        run: cargo install cargo-ndk@4.1.2 --locked
      - name: Cross-build the library with the runner's NDK
        run: cargo ndk -t arm64-v8a -t x86_64 build -p ligature-android --release
      - name: Kotlin bindings generate from the host build
        run: |
          cargo build -p ligature-android
          cargo run -p ligature-android --features bindgen --bin uniffi-bindgen -- \
            generate --library target/debug/libligature_android.so --language kotlin \
            --no-format --out-dir target/kotlin

  android-app:
    name: Android app (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl
      - name: cargo-ndk
        run: cargo install cargo-ndk@4.1.2 --locked
      - name: The NDK the app pins (the runner's own is another version)
        run: |
          version=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$version"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble the debug APK (builds the Rust library and the bindings on the way)
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: ligature-debug-apk
          path: impl/android/app/build/outputs/apk/debug/app-debug.apk

  deny:
    name: cargo-deny (licences, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: impl/Cargo.toml
          command: check

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md

  site:
    name: Documentation site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - name: mkdocs build, strict, so a broken link fails the build
        run: mkdocs build --strict -f site/mkdocs.yml

  schemas:
    name: JSON Schema compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compile every schema under draft 2020-12
        run: |
          set -e
          npm install --no-save ajv-cli@5.0.0 ajv-formats@3.0.1
          # A schema may reference another by file name (message -> envelope), so every
          # other schema is supplied with -r.
          for f in schemas/*.schema.json; do
            refs=""
            for r in schemas/*.schema.json; do
              [ "$r" != "$f" ] && refs="$refs -r $r"
            done
            # shellcheck disable=SC2086
            npx ajv compile --spec=draft2020 -c ajv-formats -s "$f" $refs
          done
