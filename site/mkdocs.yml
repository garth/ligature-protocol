# The documentation site, built by MkDocs with the Material theme from docs/ and
# published to GitHub Pages by .github/workflows/pages.yml (LP-137). Build it
# locally with:  pip install -r site/requirements.txt && mkdocs build --strict -f site/mkdocs.yml
site_name: Ligature Protocol
site_url: https://garth.github.io/ligature-protocol/
site_description: >-
  Your devices, working as one: the clipboard, notifications and files move between the
  devices you own, directly, with no account and no server.
repo_url: https://github.com/garth/ligature-protocol
repo_name: garth/ligature-protocol
edit_uri: edit/main/docs/
copyright: >-
  Specification and documentation CC-BY-4.0, code Apache-2.0.
  Supported by <a href="https://nordstack.co.uk">NordStack Ltd</a>.
docs_dir: ../docs
site_dir: ../build/site
strict: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/link-variant
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

hooks:
  - hooks.py

# Links that leave docs/ (the schemas, the licences, the implementation) are
# rewritten to GitHub by hooks.py, so every other broken link is an error.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# The site is for users and for presenting the protocol: the decisions, the
# milestone plans and the security audits stay on GitHub, and hooks.py sends a
# link to them there.
exclude_docs: |
  adr/
  milestones/
  security-audit/

nav:
  - Home: index.md
  - User guide:
      - 'Using Ligature': guide/index.md
      - 'Install': guide/install.md
      - 'First steps': guide/first-steps.md
      - 'The clipboard': guide/clipboard.md
      - 'Notifications': guide/notifications.md
      - 'Files': guide/files.md
      - 'Keyboard and mouse': guide/input.md
      - 'Screens': guide/screen.md
      - 'Your devices': guide/devices.md
      - 'Upgrading and uninstalling': guide/upgrade-uninstall.md
      - 'Troubleshooting': guide/troubleshooting.md
  - Specification:
      - 'Overview': spec/00-overview.md
      - 'Identity': spec/01-identity.md
      - 'Device Binding': spec/02-device-binding.md
      - 'Session Encryption and Exposure': spec/03-encryption.md
      - 'Discovery and Transport': spec/04-discovery-transport.md
      - 'Capabilities': spec/05-capabilities.md
      - 'Local State and Gossip': spec/06-state-sync.md
      - 'Loss, Compromise and Rebuild': spec/07-recovery.md
      - 'Platform Notes': spec/08-platform-notes.md
      - 'Threat Model': spec/09-threat-model.md
      - 'Shared Devices and Groups': spec/10-shared-devices-and-groups.md
      - Glossary: glossary.md
      - 'Prior art': prior-art.md
