[package]
name = "lp-macos"
description = "Ligature Protocol: the macOS pasteboard, user notification centre, Quartz input and screen capture behind a safe API, for the daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-user-notifications.workspace = true
block2.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
dispatch2.workspace = true

# Not the workspace lints: the pasteboard's lazy data provider and the
# notification centre's delegate are Objective-C classes, whose initialisation
# and thread marking need `unsafe`. The daemon's clipboard and notification
# code stays safe by calling this crate. On any other platform the crate is
# empty.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
